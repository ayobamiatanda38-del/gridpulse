/* ============================= DEMO DATA ENGINE ============================= */
function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++){ h=(Math.imul(31,h)+str.charCodeAt(i))|0; } return h; }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const MARKET_DEFS = [
  { id:"de", name:"Germany", label:"Germany Day-Ahead", currency:"€", base:118, renewShare:0.62 },
  { id:"fr", name:"France",  label:"France Day-Ahead",  currency:"€", base:94,  renewShare:0.38 },
  { id:"es", name:"Spain",   label:"Spain Day-Ahead",   currency:"€", base:79,  renewShare:0.55 },
  { id:"gb", name:"United Kingdom", label:"UK Day-Ahead", currency:"£", base:108, renewShare:0.44 },
  { id:"it", name:"Italy",   label:"Italy Day-Ahead",   currency:"€", base:131, renewShare:0.33 },
  { id:"no", name:"Nordics", label:"Nordics Day-Ahead", currency:"€", base:44,  renewShare:0.86 },
  { id:"nl", name:"Netherlands", label:"Netherlands Day-Ahead", currency:"€", base:113, renewShare:0.41 },
  { id:"pl", name:"Poland",  label:"Poland Day-Ahead",  currency:"€", base:142, renewShare:0.21 },
];

function generateSeries(def, hours=168){
  const rnd = mulberry32(hashSeed(def.id + "-gridpulse-v1"));
  const series = [];
  let walk = 0;
  const now = Date.now();
  for(let h=hours-1; h>=0; h--){
    const t = now - h*3600*1000;
    const hourOfDay = new Date(t).getHours();
    // solar dip mid-day, scaled by renewable share
    const solarDip = def.renewShare * 0.5 * Math.max(0, Math.sin(Math.PI*(hourOfDay-6)/12)) * (hourOfDay>6 && hourOfDay<19 ? 1:0);
    // evening peak
    const eveningPeak = (hourOfDay>=17 && hourOfDay<=21) ? 0.30*Math.exp(-Math.pow(hourOfDay-19,2)/3) : 0;
    // night trough
    const nightDip = (hourOfDay>=1 && hourOfDay<=5) ? 0.18 : 0;
    walk += (rnd()-0.5)*0.06;
    walk = Math.max(-0.35, Math.min(0.35, walk));
    const noise = (rnd()-0.5)*0.08;
    let mult = 1 - solarDip + eveningPeak - nightDip + walk + noise;
    let price = def.base * mult;
    // occasional negative-price event for high-renewable markets
    if(def.renewShare>0.5 && hourOfDay>=11 && hourOfDay<=14 && rnd()<0.06){ price = -Math.abs(price*0.15) - rnd()*8; }
    series.push({ t, price: Math.round(price*100)/100, hour: hourOfDay });
  }
  return series;
}

function stdev(arr){
  if(arr.length<2) return 0;
  const m = arr.reduce((a,b)=>a+b,0)/arr.length;
  const v = arr.reduce((a,b)=>a+Math.pow(b-m,2),0)/arr.length;
  return Math.sqrt(v);
}

function buildMarket(def){
  const series = generateSeries(def);
  const last = series[series.length-1];
  const prev24 = series[series.length-25] || series[0];
  const first = series[0];
  const today = series.slice(-24);
  const last48 = series.slice(-48).map(p=>p.price);
  const returns = [];
  for(let i=1;i<last48.length;i++){ returns.push((last48[i]-last48[i-1])); }
  const volatility = Math.round(stdev(returns)*10)/10;
  const todayHigh = Math.max(...today.map(p=>p.price));
  const todayLow = Math.min(...today.map(p=>p.price));
  const avg = Math.round((today.reduce((a,p)=>a+p.price,0)/today.length)*100)/100;
  const change24 = prev24.price!==0 ? ((last.price-prev24.price)/Math.abs(prev24.price))*100 : 0;
  const change7d = first.price!==0 ? ((last.price-first.price)/Math.abs(first.price))*100 : 0;
  const cheapest = today.reduce((a,b)=> b.price<a.price? b:a, today[0]);
  const priciest = today.reduce((a,b)=> b.price>a.price? b:a, today[0]);
  const rnd = mulberry32(hashSeed(def.id+"-drivers"));
  const drivers = {
    demand: Math.round((rnd()*20-6)*10)/10,
    solar: Math.round((rnd()*40-8)*10)/10,
    wind: Math.round((rnd()*30-10)*10)/10,
    temperature: Math.round(rnd()*14+2),
    gas: Math.round((rnd()*10-4)*10)/10,
    gridStatus: volatility>9 ? "Tight" : volatility>5 ? "Normal" : "Comfortable",
  };
  return {
    ...def, series, current: last.price, change24, change7d, volatility, todayHigh, todayLow, avg,
    prevClose: prev24.price, cheapest, priciest, drivers,
    ath: Math.round(Math.max(...series.map(p=>p.price))*1.32*100)/100,
    atl: Math.round(Math.min(...series.map(p=>p.price))*0.55*100)/100,
    lastUpdated: new Date(last.t),
  };
}

const MARKETS = MARKET_DEFS.map(buildMarket);

function fmt(n, currency="€"){
  if(n===undefined||n===null||isNaN(n)) return "—";
  const sign = n<0 ? "-" : "";
  return `${sign}${currency}${Math.abs(n).toFixed(2)}`;
}
function fmtPct(n){
  if(n===undefined||n===null||isNaN(n)) return "—";
  return `${n>=0?"+":""}${n.toFixed(1)}%`;
}
function timeAgo(d){
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return "just now";
  if(s<3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

function Sparkline({ data, positive }){
  const points = data.map(d=>d.price);
  const w=100,h=32, min=Math.min(...points), max=Math.max(...points), range=(max-min)||1;
  const path = points.map((p,i)=>{
    const x = (i/(points.length-1))*w;
    const y = h - ((p-min)/range)*h;
    return `${i===0?"M":"L"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-8" preserveAspectRatio="none">
      <path d={path} fill="none" stroke={positive?"var(--positive)":"var(--negative)"} strokeWidth="1.6" />
    </svg>
  );
}

/* ============================= PORTFOLIO PAGE ============================= */
function PortfolioPage({ positions, closePosition, balance }){
  const open = positions.filter(p=>p.status==="open");
  const closed = positions.filter(p=>p.status==="closed");
  const leverage = 8;
  const withPnl = open.map(p=>{
    const m = MARKETS.find(x=>x.id===p.marketId);
    const pnl = (p.direction==="long"?1:-1) * ((m.current-p.entryPrice)/p.entryPrice) * p.stake * leverage;
    return {...p, market:m, pnl};
  });
  const unrealized = withPnl.reduce((a,p)=>a+p.pnl,0);
  const realized = closed.reduce((a,p)=>a+p.pnl,0);
  const totalValue = balance + open.reduce((a,p)=>a+p.stake,0) + unrealized;
  const wins = closed.filter(p=>p.pnl>0).length;
  const winRate = closed.length ? Math.round((wins/closed.length)*100) : 0;

  const perfData = useMemo(()=>{
    let running = 10000;
    const pts = [{i:0, v:running}];
    closed.forEach((p,i)=>{ running += p.pnl; pts.push({i:i+1, v:Math.round(running*100)/100}); });
    if(pts.length===1) pts.push({i:1, v:running});
    return pts;
  },[closed]);

  return (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10">
      <p className="text-xs uppercase tracking-wide text-dim font-mono mb-2">Portfolio</p>
      <h1 className="font-display text-3xl mb-8">Your Demo Portfolio</h1>

      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div className="card p-5"><p className="text-dim text-xs mb-1">Portfolio value</p><p className="font-mono text-2xl">€{totalValue.toFixed(2)}</p></div>
        <div className="card p-5"><p className="text-dim text-xs mb-1">Available balance</p><p className="font-mono text-2xl">€{balance.toFixed(2)}</p></div>
        <div className="card p-5"><p className="text-dim text-xs mb-1">Unrealized P&L</p><p className={`font-mono text-2xl ${unrealized>=0?"text-pos":"text-neg"}`}>{unrealized>=0?"+":""}€{unrealized.toFixed(2)}</p></div>
        <div className="card p-5"><p className="text-dim text-xs mb-1">Win rate</p><p className="font-mono text-2xl">{winRate}%</p></div>
      </div>

      <div className="card p-5 mb-10">
        <p className="text-xs uppercase tracking-wide text-dim font-mono mb-4">Performance over closed trades</p>
        <ResponsiveContainer width="100%" height={200}>
          <LineChart data={perfData} margin={{top:5,right:5,left:-10,bottom:0}}>
            <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" vertical={false} />
            <XAxis dataKey="i" tick={{fontSize:10, fill:"var(--text-dim)"}} axisLine={false} tickLine={false} />
            <YAxis tick={{fontSize:10, fill:"var(--text-dim)"}} axisLine={false} tickLine={false} width={50} domain={['auto','auto']} />
            <Tooltip contentStyle={{background:"var(--surface2)", border:"1px solid var(--border)", borderRadius:8, fontSize:12}} formatter={(v)=>["€"+v,"Balance"]} />
            <Line type="monotone" dataKey="v" stroke="var(--accent)" strokeWidth={2} dot={false} isAnimationActive={false}/>
          </LineChart>
        </ResponsiveContainer>
      </div>

      <p className="text-xs uppercase tracking-wide text-dim font-mono mb-3">Open positions</p>
      {withPnl.length===0 ? (
        <div className="card mb-10"><EmptyState title="No open positions" sub="Head to the trade terminal to open a simulated position." cta="Go to Trade" onCta={()=>nav("#/trade")} /></div>
      ) : (
        <div className="card overflow-x-auto mb-10">
          <table className="w-full text-sm min-w-[600px]">
            <thead className="hairline border-b"><tr>
              {["Market","Direction","Entry","Current","Stake","P&L",""].map(h=><th key={h} className="text-left text-xs uppercase text-dim font-mono py-3 px-3">{h}</th>)}
            </tr></thead>
            <tbody>
              {withPnl.map(p=>(
                <tr key={p.id} className="hairline border-b last:border-0">
                  <td className="py-3 px-3">{p.market.name}</td>
                  <td className="py-3 px-3"><Tag tone={p.direction==="long"?"pos":"neg"}>{p.direction}</Tag></td>
                  <td className="py-3 px-3 font-mono">{fmt(p.entryPrice, p.market.currency)}</td>
                  <td className="py-3 px-3 font-mono">{fmt(p.market.current, p.market.currency)}</td>
                  <td className="py-3 px-3 font-mono">€{p.stake}</td>
                  <td className={`py-3 px-3 font-mono ${p.pnl>=0?"text-pos":"text-neg"}`}>{p.pnl>=0?"+":""}€{p.pnl.toFixed(2)}</td>
                  <td className="py-3 px-3"><button onClick={()=>closePosition(p.id, p.market.current)} className="text-xs border border-hair rounded-md px-2 py-1">Close</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <p className="text-xs uppercase tracking-wide text-dim font-mono mb-3">Trade history</p>
      {closed.length===0 ? (
        <div className="card"><EmptyState title="No closed trades yet" sub="Closed simulated trades will show up here." /></div>
      ) : (
        <div className="card overflow-x-auto">
          <table className="w-full text-sm min-w-[600px]">
            <thead className="hairline border-b"><tr>
              {["Market","Direction","Entry","Exit","Stake","P&L","Status"].map(h=><th key={h} className="text-left text-xs uppercase text-dim font-mono py-3 px-3">{h}</th>)}
            </tr></thead>
            <tbody>
              {closed.slice().reverse().map(p=>(
                <tr key={p.id} className="hairline border-b last:border-0">
                  <td className="py-3 px-3">{MARKETS.find(m=>m.id===p.marketId)?.name}</td>
                  <td className="py-3 px-3"><Tag tone={p.direction==="long"?"pos":"neg"}>{p.direction}</Tag></td>
                  <td className="py-3 px-3 font-mono">{fmt(p.entryPrice, MARKETS.find(m=>m.id===p.marketId)?.currency)}</td>
                  <td className="py-3 px-3 font-mono">{fmt(p.closePrice, MARKETS.find(m=>m.id===p.marketId)?.currency)}</td>
                  <td className="py-3 px-3 font-mono">€{p.stake}</td>
                  <td className={`py-3 px-3 font-mono ${p.pnl>=0?"text-pos":"text-neg"}`}>{p.pnl>=0?"+":""}€{p.pnl.toFixed(2)}</td>
                  <td className="py-3 px-3"><Tag>{p.pnl>=0?"Win":"Loss"}</Tag></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ============================= BUSINESS CALCULATOR ============================= */
function BusinessPage(){
  const [usage, setUsage] = useState(10000);
  const [current, setCurrent] = useState(0.14);
  const [future, setFuture] = useState(0.20);
  const currentCost = usage*current;
  const futureCost = usage*future;
  const diff = futureCost-currentCost;
  const pct = current ? (diff/currentCost)*100 : 0;

  return (
    <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10">
      <p className="text-xs uppercase tracking-wide text-dim font-mono mb-2">For business</p>
      <h1 className="font-display text-3xl mb-2">Protect Your Energy Costs</h1>
      <p className="text-dim mb-8 max-w-xl">Estimate what a price move would do to your monthly bill. This is an educational calculator, not a quote or guaranteed outcome.</p>

      <div className="grid lg:grid-cols-2 gap-6">
        <div className="card p-6">
          <p className="text-xs uppercase tracking-wide text-dim font-mono mb-4">Your numbers</p>
          <label className="text-sm">Monthly electricity usage (kWh)</label>
          <input type="number" value={usage} onChange={e=>setUsage(Number(e.target.value)||0)} className="w-full bg-surface2 border border-hair rounded-lg px-3 py-2 text-sm mt-1 mb-4 font-mono" />
          <label className="text-sm">Current price (€ / kWh)</label>
          <input type="number" step="0.01" value={current} onChange={e=>setCurrent(Number(e.target.value)||0)} className="w-full bg-surface2 border border-hair rounded-lg px-3 py-2 text-sm mt-1 mb-4 font-mono" />
          <label className="text-sm">Expected future price (€ / kWh)</label>
          <input type="number" step="0.01" value={future} onChange={e=>setFuture(Number(e.target.value)||0)} className="w-full bg-surface2 border border-hair rounded-lg px-3 py-2 text-sm mt-1 font-mono" />
        </div>

        <div className="card p-6">
          <p className="text-xs uppercase tracking-wide text-dim font-mono mb-4">Estimated impact</p>
          <div className="space-y-4">
            <div className="flex justify-between items-baseline"><span className="text-dim text-sm">Current estimated cost</span><span className="font-mono text-lg">€{currentCost.toFixed(2)}/mo</span></div>
            <div className="flex justify-between items-baseline"><span className="text-dim text-sm">At future price</span><span className="font-mono text-lg">€{futureCost.toFixed(2)}/mo</span></div>
            <div className="hairline border-t pt-4 flex justify-between items-baseline">
              <span className="text-sm">Potential {diff>=0?"increase":"decrease"}</span>
              <span className={`font-mono text-xl ${diff>=0?"text-neg":"text-pos"}`}>{diff>=0?"+":""}€{Math.abs(diff).toFixed(2)}/mo ({fmtPct(pct)})</span>
            </div>
            <div className="flex justify-between items-baseline"><span className="text-dim text-sm">Annualized impact</span><span className="font-mono">€{Math.abs(diff*12).toFixed(2)}/yr</span></div>
          </div>
          <button onClick={()=>nav("#/trade")} className="w-full bg-accent py-2.5 rounded-lg font-medium mt-6 text-sm">Explore protection scenarios</button>
          <p className="text-[11px] text-dim leading-relaxed mt-4">This calculator is for illustration only and does not constitute a quote, guarantee, or energy procurement advice.</p>
        </div>
      </div>
    </div>
  );
}

/* ============================= ALERT MODAL ============================= */
function AlertModal({ marketId, onClose, addAlert }){
  const m = MARKETS.find(x=>x.id===marketId) || MARKETS[0];
  const [selMarket, setSelMarket] = useState(marketId || MARKETS[0].id);
  const [condition, setCondition] = useState("rises above");
  const [value, setValue] = useState(Math.round(m.current*1.1));
  return (
    <Modal title="New price alert" onClose={onClose}>
      <label className="text-xs text-dim">Market</label>
      <select value={selMarket} onChange={e=>setSelMarket(e.target.value)} className="w-full bg-surface2 border border-hair rounded-lg px-3 py-2 text-sm mt-1 mb-4">
        {MARKETS.map(mk=><option key={mk.id} value={mk.id}>{mk.label}</option>)}
      </select>
      <label className="text-xs text-dim">Condition</label>
      <select value={condition} onChange={e=>setCondition(e.target.value)} className="w-full bg-surface2 border border-hair rounded-lg px-3 py-2 text-sm mt-1 mb-4">
        <option>rises above</option><option>falls below</option><option>moves more than 15% in 24h</option>
      </select>
      {condition!=="moves more than 15% in 24h" && (
        <>
          <label className="text-xs text-dim">Price ({MARKETS.find(x=>x.id===selMarket).currency}/MWh)</label>
          <input type="number" value={value} onChange={e=>setValue(Number(e.target.value))} className="w-full bg-surface2 border border-hair rounded-lg px-3 py-2 text-sm mt-1 mb-4 font-mono" />
        </>
      )}
      <button onClick={()=>{ addAlert({marketId:selMarket, condition, value}); onClose(); }} className="w-full bg-accent py-2.5 rounded-lg font-medium text-sm">Create alert</button>
    </Modal>
  );
}

/* ============================= APP ROOT ============================= */
function App(){
  const route = useHashRoute();
  const [theme, setTheme] = useState("dark");
  const [mobileOpen, setMobileOpen] = useState(false);
  const [watchlist, setWatchlist] = useState(["de","gb"]);
  const [alerts, setAlerts] = useState([]);
  const [alertModal, setAlertModal] = useState(null);
  const [positions, setPositions] = useState([]);
  const [balance, setBalance] = useState(10000);
  const [tradeMarket, setTradeMarket] = useState("de");
  const [toasts, setToasts] = useState([]);

  useEffect(()=>{ document.documentElement.className = theme==="light" ? "light" : ""; },[theme]);

  const toggleWatch = (id)=> setWatchlist(w=> w.includes(id) ? w.filter(x=>x!==id) : [...w, id]);
  const addAlert = (a)=> { setAlerts(al=>[...al, {...a, id:Date.now()}]); pushToast(`Alert created for ${MARKETS.find(m=>m.id===a.marketId).name}`); };
  const removeAlert = (id)=> setAlerts(al=>al.filter(a=>a.id!==id));

  const pushToast = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t, {id, msg}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3500);
  };

  const openPosition = ({marketId, direction, stake, entryPrice, sl, tp})=>{
    if(stake>balance) return;
    setBalance(b=>b-stake);
    setPositions(p=>[...p, {id:Date.now(), marketId, direction, stake, entryPrice, sl, tp, status:"open", openedAt:Date.now()}]);
  };
  const closePosition = (id, currentPrice)=>{
    setPositions(prev=> prev.map(p=>{
      if(p.id!==id) return p;
      const leverage=8;
      const pnl = (p.direction==="long"?1:-1) * ((currentPrice-p.entryPrice)/p.entryPrice) * p.stake * leverage;
      setBalance(b=> b + p.stake + pnl);
      pushToast(`Closed ${p.direction} position: ${pnl>=0?"+":""}€${pnl.toFixed(2)}`);
      return {...p, status:"closed", closePrice:currentPrice, pnl};
    }));
  };

  const goTrade = (id)=>{ setTradeMarket(id); nav("#/trade"); };
  const openAlertModal = (id)=> setAlertModal(id);

  const open = positions.filter(p=>p.status==="open");
  const leverage=8;
  const unrealized = open.reduce((a,p)=>{ const m=MARKETS.find(x=>x.id===p.marketId); return a + (p.direction==="long"?1:-1)*((m.current-p.entryPrice)/p.entryPrice)*p.stake*leverage; },0);
  const portfolio = { totalValue: balance + open.reduce((a,p)=>a+p.stake,0) + unrealized, openCount: open.length };

  let page;
  if(route==="#/" || route==="") page = <Landing/>;
  else if(route==="#/markets") page = <MarketsPage watchlist={watchlist} toggleWatch={toggleWatch} />;
  else if(route.startsWith("#/market/")) page = <MarketDetail id={route.split("/")[2]} watchlist={watchlist} toggleWatch={toggleWatch} openAlertModal={openAlertModal} goTrade={goTrade} />;
  else if(route==="#/dashboard") page = <Dashboard watchlist={watchlist} toggleWatch={toggleWatch} alerts={alerts} openAlertModal={openAlertModal} removeAlert={removeAlert} portfolio={portfolio} />;
  else if(route==="#/trade") page = <TradePage marketId={tradeMarket} setMarketId={setTradeMarket} positions={positions} openPosition={openPosition} closePosition={closePosition} balance={balance} toast={pushToast} />;
  else if(route==="#/portfolio") page = <PortfolioPage positions={positions} closePosition={closePosition} balance={balance} />;
  else if(route==="#/learn") page = <LearnPage/>;
  else if(route==="#/business") page = <BusinessPage/>;
  else page = <Landing/>;

  return (
    <div className="min-h-screen pb-16 lg:pb-0">
      <TopNav theme={theme} toggleTheme={()=>setTheme(t=>t==="dark"?"light":"dark")} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
      {page}
      <Footer/>
      <MobileTabBar/>
      <Toast toasts={toasts} />
      {alertModal && <AlertModal marketId={alertModal} onClose={()=>setAlertModal(null)} addAlert={addAlert} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
